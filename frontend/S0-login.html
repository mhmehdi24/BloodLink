<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/><style>@layer base { html, body { margin: 0; padding: 0; } body { overscroll-behavior: none; } main > :first-child { margin-top: 0 !important; } main > :last-child { margin-bottom: 0 !important; } } ::-webkit-scrollbar { display: none; }</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-primary-fixed-variant": "#93000b", "on-primary-container": "#ffcdc7", "outline-variant": "#e4beb9", "on-secondary-fixed": "#0d1c2e", "primary-fixed": "#ffdad6", "surface-variant": "#dae2fd", "on-error-container": "#93000a", "surface-container-high": "#e2e7ff", "error-container": "#ffdad6", "surface-tint": "#b91c1c", "on-error": "#ffffff", "tertiary-fixed-dim": "#93ccff", "inverse-surface": "#283044", "surface-container-highest": "#dae2fd", "primary-fixed-dim": "#ffb4ab", "error": "#ba1a1a", "on-tertiary-fixed-variant": "#004b73", "tertiary-fixed": "#cce5ff", "surface-container": "#eaedff", "secondary-container": "#d5e3fc", "primary-container": "#b91c1c", "surface-container-lowest": "#ffffff", "on-tertiary-container": "#b8dcff", "inverse-on-surface": "#eef0ff", "on-secondary-container": "#57657a", "on-tertiary-fixed": "#001d31", "secondary": "#515f74", "on-tertiary": "#ffffff", "secondary-fixed-dim": "#b9c7df", "inverse-primary": "#ffb4ab", "surface-container-low": "#f2f3ff", "surface": "#faf8ff", "background": "#faf8ff", "on-surface-variant": "#5b403d", "on-secondary": "#ffffff", "surface-dim": "#d2d9f4", "primary": "#93000b", "outline": "#8f6f6c", "on-background": "#131b2e", "secondary-fixed": "#d5e3fc", "on-primary-fixed": "#410002", "on-primary": "#ffffff", "tertiary": "#004a73", "on-secondary-fixed-variant": "#3a485b", "surface-bright": "#faf8ff", "tertiary-container": "#006397", "on-surface": "#131b2e" }, "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, "spacing": { "space-xl": "2rem", "space-sm": "0.5rem", "margin": "2rem", "gutter-sm": "1rem", "space-xs": "0.25rem", "space-md": "1rem", "margin-sm": "1rem", "gutter": "1.5rem", "space-lg": "1.5rem" }, "fontFamily": { "headline-md": ["Inter"], "headline-xl-mobile": ["Inter"], "headline-lg-mobile": ["Inter"], "data-metric": ["Inter"], "data-table": ["Inter"], "body-md": ["Inter"], "body-lg": ["Inter"], "headline-lg": ["Inter"], "headline-xl": ["Inter"], "label-md": ["Inter"], "label-lg": ["Inter"], "label-sm": ["Inter"], "body-sm": ["Inter"] }, "fontSize": { "headline-md": ["1.125rem", { "lineHeight": "1.5rem", "letterSpacing": "-0.01em", "fontWeight": "600" }], "headline-xl-mobile": ["1.75rem", { "lineHeight": "2.25rem", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-lg-mobile": ["1.25rem", { "lineHeight": "1.75rem", "letterSpacing": "-0.015em", "fontWeight": "600" }], "data-metric": ["2rem", { "lineHeight": "2.25rem", "letterSpacing": "-0.03em", "fontWeight": "700" }], "data-table": ["0.8125rem", { "lineHeight": "1.25rem", "letterSpacing": "0em", "fontWeight": "400" }], "body-md": ["0.875rem", { "lineHeight": "1.25rem", "letterSpacing": "0em", "fontWeight": "400" }], "body-lg": ["1rem", { "lineHeight": "1.5rem", "letterSpacing": "0em", "fontWeight": "400" }], "headline-lg": ["1.5rem", { "lineHeight": "2rem", "letterSpacing": "-0.02em", "fontWeight": "600" }], "headline-xl": ["2.25rem", { "lineHeight": "2.75rem", "letterSpacing": "-0.025em", "fontWeight": "700" }], "label-md": ["0.75rem", { "lineHeight": "1rem", "letterSpacing": "0.02em", "fontWeight": "600" }], "label-lg": ["0.875rem", { "lineHeight": "1.25rem", "letterSpacing": "-0.005em", "fontWeight": "600" }], "label-sm": ["0.6875rem", { "lineHeight": "0.875rem", "letterSpacing": "0.04em", "fontWeight": "600" }], "body-sm": ["0.75rem", { "lineHeight": "1rem", "letterSpacing": "0.01em", "fontWeight": "400" }] } } } };</script></head><body class="bg-background text-on-surface font-body-md text-body-md min-h-screen"><main class="w-full min-h-screen flex items-center justify-center p-margin"><div class="flex flex-col w-full items-center justify-center min-h-[calc(100vh-4rem)] relative py-space-xl">
<!-- Subtle decorative ambient pulse behind the clinical container -->
<div class="absolute w-72 h-72 rounded-full bg-primary/5 blur-3xl pointer-events-none -z-10"></div>
<!-- Central Clinical Login Card -->
<div class="w-full max-w-[400px] bg-surface-container-lowest rounded-xl shadow-md p-space-xl relative">
<!-- Header / Brand identity -->
<div class="flex flex-col items-center text-center">
<div class="w-12 h-12 rounded-lg bg-surface-container-low flex items-center justify-center p-space-xs mb-space-sm shadow-sm">
<img alt="BloodLink Brand Emblem" class="w-9 h-9 object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1US7GfQKYudPSiyZ4m4B3u1TkQTOluehnSXBM4yniFude8VkvAuuImkfsDLVEN6DlrGaHVNUF5SVyS_p0xNtf2yLbpnYXlogKoNXfTFJ8P1mOU5tMhHOHgETR5ivWoffNkuqzBMWUk2j_GCLl0a-8a0EyHoJSfxOsLcaTi4XbamRkh8nsEVKRT1sgO64J7g0nf_iu37Pg5wxvgSIro42MeYueZp_64x4ecHHBwIKfQg2fmWy6v6Rz0"/>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">BloodLink</h1>
<p class="font-label-sm text-label-sm text-secondary uppercase tracking-widest mt-space-xs">Central Command Hub</p>
</div>
<!-- Feedback notification (hidden by default) -->
<div class="hidden mt-space-md p-space-sm rounded-lg bg-error-container text-on-error-container font-body-sm text-body-sm flex items-center gap-space-xs transition-all" id="authAlert">
<span class="material-symbols-outlined text-[16px]">error</span>
<span id="authAlertText">Please verify your administrator credentials.</span>
</div>
<!-- Login Credentials Form -->
<form class="mt-space-lg flex flex-col" id="loginForm" onsubmit="handleLoginSubmit(event)">
<!-- Admin ID field -->
<div class="flex flex-col">
<label class="font-label-lg text-label-lg text-on-surface mb-1.5 flex items-center justify-between" for="adminId">
<span>Admin ID</span>
<span class="font-label-sm text-label-sm text-secondary">Authorized Personnel</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-secondary text-[18px] pointer-events-none">badge</span>
<input class="w-full h-9 pl-9 pr-3 rounded-lg bg-surface-container-low text-on-surface font-body-md text-body-md placeholder:text-secondary/60 focus:bg-surface-container-lowest focus:outline-none transition-colors" id="adminId" name="adminId" placeholder="admin" required="" type="text"/>
</div>
</div>
<!-- Password field -->
<div class="flex flex-col mt-space-md">
<label class="font-label-lg text-label-lg text-on-surface mb-1.5" for="password">
          Password
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-secondary text-[18px] pointer-events-none">lock</span>
<input class="w-full h-9 pl-9 pr-9 rounded-lg bg-surface-container-low text-on-surface font-body-md text-body-md placeholder:text-secondary/60 focus:bg-surface-container-lowest focus:outline-none transition-colors" id="password" name="password" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-2.5 text-secondary hover:text-on-surface p-0.5 rounded focus:outline-none" onclick="togglePasswordVisibility()" title="Toggle visibility" type="button">
<span class="material-symbols-outlined text-[18px] block" id="passwordToggleIcon">visibility</span>
</button>
</div>
</div>
<!-- Auxiliary Row: Remember & Recovery -->
<div class="mt-space-md flex items-center justify-between font-body-sm text-body-sm">
<label class="flex items-center gap-space-xs cursor-pointer select-none text-secondary hover:text-on-surface transition-colors">
<input class="w-4 h-4 rounded text-primary-container accent-primary focus:outline-none cursor-pointer" id="rememberMe" type="checkbox"/>
<span class="font-label-md text-label-md">Remember me</span>
</label>
<button class="font-label-md text-label-md text-secondary hover:text-on-surface transition-colors focus:outline-none" onclick="handleForgotPassword()" type="button">
          Forgot password?
        </button>
</div>
<!-- Primary Action -->
<button class="mt-space-lg w-full h-9 rounded-lg bg-primary-container text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-space-xs shadow-sm hover:opacity-95 active:scale-[0.99] transition-all" id="submitBtn" type="submit">
<span id="submitLabel">Sign In</span>
<span class="hidden material-symbols-outlined text-[16px] animate-spin" id="submitSpinner">progress_activity</span>
</button>
</form>
<!-- Visual separation -->
<div class="my-space-lg h-px w-full bg-surface-container-high"></div>
<!-- Technical System Metadata -->
<div class="flex flex-col items-center text-center gap-space-xs">
<div class="flex items-center gap-1.5 font-label-sm text-label-sm text-secondary">
<span class="w-1.5 h-1.5 rounded-full bg-emerald-600"></span>
<span>Secure Gateway Online</span>
</div>
<p class="font-label-sm text-label-sm text-secondary/80">
        BloodLink v1.0 — Central Hub Access Only
      </p>
</div>
</div>
<!-- Interactive script strictly for form UX and feedback -->
<script>
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('password');
      const toggleIcon = document.getElementById('passwordToggleIcon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        toggleIcon.textContent = 'visibility_off';
      } else {
        pwdInput.type = 'password';
        toggleIcon.textContent = 'visibility';
      }
    }

    function handleForgotPassword() {
      const alertBox = document.getElementById('authAlert');
      const alertText = document.getElementById('authAlertText');
      alertBox.classList.remove('hidden');
      alertText.textContent = 'Contact Laboratory IT dispatch for security token resets.';
    }

    function handleLoginSubmit(event) {
      event.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const submitLabel = document.getElementById('submitLabel');
      const submitSpinner = document.getElementById('submitSpinner');
      const alertBox = document.getElementById('authAlert');

      alertBox.classList.add('hidden');
      submitLabel.textContent = 'Authenticating...';
      submitSpinner.classList.remove('hidden');
      submitBtn.setAttribute('disabled', 'true');

      setTimeout(() => {
        submitSpinner.classList.add('hidden');
        submitLabel.textContent = 'Sign In';
        submitBtn.removeAttribute('disabled');
        
        const adminVal = document.getElementById('adminId').value;
        if (adminVal.toLowerCase() !== 'admin') {
          alertBox.classList.remove('hidden');
          document.getElementById('authAlertText').textContent = 'Unauthorized ID. Restricted to Dispatch and Medical Officers.';
        } else {
          submitLabel.textContent = 'Access Granted';
        }
      }, 750);
    }
  </script>
</div></main></body></html>
